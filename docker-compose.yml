# Mining Inspection Management System (MIMS)
# Own project name, containers, volume, network and database, separate from the
# old complaint system, so both can run on the same server without touching each other.
name: mims

services:
  postgres:
    image: postgres:16
    container_name: mims_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-mims_db}
      POSTGRES_USER: ${DB_USER:-mims_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mims@mom.gov.et}
    volumes:
      - mims_postgres_data:/var/lib/postgresql/data
    networks:
      - mims_network

  backend:
    build: ./backend
    container_name: mims_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      PORT: 4001
      DB_HOST: postgres
      DB_PORT: 5432
      # Same values as the postgres service, so the password can never differ
      DB_NAME: ${DB_NAME:-mims_db}
      DB_USER: ${DB_USER:-mims_user}
      DB_PASSWORD: ${DB_PASSWORD:-mims@mom.gov.et}
      SOCKET_PORT: 5001
      NODE_ENV: production
    # Reachable from the server itself for checks (curl http://127.0.0.1:4001); users go through nginx
    ports:
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:5001:5001"
    depends_on:
      - postgres
    networks:
      - mims_network
    volumes:
      - ./backend/uploads:/app/uploads
      # Inspection photos / documents / videos / signatures (private; back this folder up)
      - ./backend/storage:/app/storage
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SYSTEM_TIMEZONE: ${NEXT_PUBLIC_SYSTEM_TIMEZONE:-Africa/Addis_Ababa}
    container_name: mims_frontend
    restart: always
    env_file:
      - ./frontend/.env
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      AUTH_TRUSTED_HOST: "true"
      NEXTAUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://${DOMAIN:-inspection.mom.gov.et}}
      BACKEND_INTERNAL_URL: http://backend:4001
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - backend
    networks:
      - mims_network

  nginx:
    build: ./nginx
    container_name: mims_nginx
    restart: always
    environment:
      DOMAIN: ${DOMAIN:-inspection.mom.gov.et}
    # HTTPS is required: browsers only allow GPS and the camera on https://
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.bootstrap:/etc/nginx/templates/nginx.conf.bootstrap:ro
      - ./nginx/nginx.conf.production:/etc/nginx/templates/nginx.conf.production:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - mims_network

  certbot:
    image: certbot/certbot
    container_name: mims_certbot
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-inspection.mom.gov.et}
      EMAIL: ${EMAIL:-admin@inspection.mom.gov.et}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
    entrypoint: /bin/sh /certbot-entrypoint.sh
    networks:
      - mims_network
    depends_on:
      - nginx
volumes:
  mims_postgres_data:

networks:
  mims_network:
    driver: bridge
