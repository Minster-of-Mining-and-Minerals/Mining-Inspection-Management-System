# Mining Inspection Management System (MIMS)
# Own project name, containers, volume, network and database, separate from the
# old complaint system, so both can run on the same server without touching each other.
name: mims

services:
  postgres:
    image: postgres:16
    container_name: mims_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-mims_db}
      POSTGRES_USER: ${DB_USER:-mims_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mims@mom.gov.et}
    volumes:
      - mims_postgres_data:/var/lib/postgresql/data
    networks:
      - mims_network

  backend:
    build: ./backend
    container_name: mims_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      PORT: 4002
      DB_HOST: postgres
      DB_PORT: 5432
      SOCKET_PORT: 5002
    depends_on:
      - postgres
    networks:
      - mims_network
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SYSTEM_TIMEZONE: ${NEXT_PUBLIC_SYSTEM_TIMEZONE:-Africa/Addis_Ababa}
    container_name: mims_frontend
    restart: always
    env_file:
      - ./frontend/.env
    environment:
      PORT: 3002
      NODE_ENV: production
      AUTH_TRUSTED_HOST: "true"
      NEXTAUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://${DOMAIN:-10.0.71.199:3003}}
      BACKEND_INTERNAL_URL: http://backend:4002
    depends_on:
      - backend
    networks:
      - mims_network

  nginx:
    build: ./nginx
    container_name: mims_nginx
    restart: always
    environment:
      DOMAIN: ${DOMAIN:-10.0.71.199:3003}
    ports:
      - "${APP_PORT:-3003}:80"
    volumes:
      - ./nginx/nginx.conf.bootstrap:/etc/nginx/templates/nginx.conf.bootstrap:ro
      - ./nginx/nginx.conf.production:/etc/nginx/templates/nginx.conf.production:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - mims_network

  certbot:
    image: certbot/certbot
    container_name: mims_certbot
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-10.0.71.199:3003}
      EMAIL: ${EMAIL:-admin@inspection.mom.gov.et}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
    entrypoint: /bin/sh /certbot-entrypoint.sh
    networks:
      - mims_network
    depends_on:
      - nginx
volumes:
  mims_postgres_data:

networks:
  mims_network:
    driver: bridge
